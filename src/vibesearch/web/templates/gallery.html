<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery {{ bundle.gallery_id }}</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head>
<body data-display="{{ display }}"><main id="reader" data-gallery="{{ bundle.gallery_id }}" data-pages="{{ bundle.num_pages }}"><a href="/?display={{ display }}">Back to search</a><h1>Gallery {{ bundle.gallery_id }}</h1>{% if display == 'full' and bundle.title %}<h2>{{ bundle.title }}</h2>{% endif %}
<nav><button id="previous-page" type="button">Previous page</button><label>Page <input type="number" id="page-number" min="1" max="{{ bundle.num_pages }}" value="1"></label><span>of {{ bundle.num_pages }}</span><button id="next-page" type="button">Next page</button></nav><p id="status" role="status" aria-live="polite"></p><img id="page-image" alt="Gallery page" decoding="async"></main></body></html>
