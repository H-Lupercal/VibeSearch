<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeSearch</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head>
<body data-display="{{ display }}"><main><h1>VibeSearch</h1><p>Local metadata search. Images load only when you open a reader.</p>
<form id="search-form"><label>Query <input id="query" maxlength="500" placeholder="Leave blank to browse"></label>
<label>Display <select id="display"><option value="full" {% if display == 'full' %}selected{% endif %}>Full</option><option value="id-only" {% if display == 'id-only' %}selected{% endif %}>ID only</option></select></label>
<fieldset><legend>Exact filters</legend><label>Field <select id="field"><option value="tags_all">All tags</option><option value="tags_any">Any tags</option><option value="artist">Artist</option><option value="character">Character</option><option value="parody">Parody</option><option value="group">Group</option><option value="language">Language</option><option value="category">Category</option><option value="exclude_tags">Exclude tags</option><option value="exclude_artists">Exclude artists</option></select></label>
<label>Name or ID <input id="selection" maxlength="500"></label><button type="button" id="suggest">Suggest names</button><button type="button" id="add-filter">Add filter</button><ul id="suggestions"></ul><ul id="filters"></ul></fieldset>
<button type="submit">Search / browse</button></form><p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="Results"></section><nav><button id="older" type="button">Previous results</button><button id="newer" type="button">Next results</button></nav></main></body></html>
