[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesearch"
version = "0.1.0"
description = "Local-first metadata discovery from a public gallery API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "filelock>=3,<5",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "typer>=0.12,<1",
  "chromadb>=1,<2",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "respx>=0.21,<1"]

[project.scripts]
vibesearch = "vibesearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
