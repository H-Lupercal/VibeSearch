[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesearch"
version = "0.2.0"
description = "Local-first metadata discovery from a public gallery API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "httpcore==1.0.9",
  "filelock>=3,<5",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "typer>=0.12,<1",
  "chromadb>=1,<2",
  "sentence-transformers>=3,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pillow>=11,<13",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "respx>=0.21,<1", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
vibesearch = "vibesearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
vibesearch = ["web/templates/*.html", "web/static/*.js", "web/static/*.css"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
